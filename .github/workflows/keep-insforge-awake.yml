name: Keep InsForge awake

# InsForge free projects pause after 7 days without requests; any request resets the clock.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping InsForge health endpoint
        run: |
          response=$(curl --fail --silent --show-error --retry 3 https://tij96tn9.us-west.insforge.app/api/health)
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
